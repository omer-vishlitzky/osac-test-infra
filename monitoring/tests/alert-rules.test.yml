# promtool unit tests of config/alert-rules.yml (run by test_alert_rules.py when
# promtool is on PATH): the alerts that must fire when a store or the gap check
# goes quiet, including the cases a plain age comparison cannot see.
rule_files:
  - ../config/alert-rules.yml
evaluation_interval: 1m
tests:
  # A store never read since the start: no series, so only CiObserveStoreUnknown can say so.
  - interval: 1m
    input_series:
      - series: 'ci_observe_store_last_success{org="o", store="trends"}'
        values: '0+60x200'
      - series: 'ci_observe_store_last_success{org="o", store="spans"}'
        values: '0+60x200'
      - series: 'ci_observe_store_last_success{org="o", store="prs"}'
        values: '0+60x200'
      - series: 'github_actions_gap_check_last_success{org="o"}'
        values: '0+60x200'
    alert_rule_test:
      - eval_time: 150m
        alertname: CiObserveStoreUnknown
        exp_alerts:
          - exp_labels:
              severity: warning
              store: logs
            exp_annotations:
              summary: "The freshness of the ci-observe logs store is unknown"
              description: "The exporter has not read when the logs store last advanced since it started: the store cannot be read, or its job has never finished a pass. Check the exporter's log for 'Store freshness of logs could not be read' and the matching ci-observe-logs service."
      - eval_time: 150m
        alertname: CiObserveGapCheckStalled
        exp_alerts: []
  # The gap check that stops answering.
  - interval: 1m
    input_series:
      - series: 'github_actions_gap_check_last_success{org="o"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 250m
        alertname: CiObserveGapCheckStalled
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The ci-observe gap check has not completed in 3 hours"
              description: "The hourly check that proves the job history complete has not finished a pass GitHub answered for every day. Check the exporter's log for 'Gap check waits' (the shared GitHub budget, github_actions_gap_check_skipped_total) or 'Gap check for ... could not read GitHub'."
