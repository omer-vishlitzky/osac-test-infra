---
name: OSAC E2E

on:
  workflow_call:
    inputs:
      test-suite:
        description: "Test suite to run: vmaas, caas, or empty string for all"
        required: false
        type: string
        default: "vmaas"
      test-filter:
        description: "pytest -k filter expression (optional)"
        required: false
        type: string
        default: ""
      namespace:
        description: "OSAC namespace on the cluster"
        required: false
        type: string
        default: "osac-e2e-ci"
      vm-template:
        description: "VM template for compute instances"
        required: false
        type: string
        default: "osac.templates.ocp_virt_vm"
      cluster-template:
        description: "Cluster template for CaaS tests"
        required: false
        type: string
        default: ""
      flavor-image:
        description: "OCI image containing the cluster-tool flavor"
        required: false
        type: string
        default: "quay.io/rh-ee-ovishlit/cluster-flavors:vmaas-helm"
      flavor-name:
        description: "cluster-tool flavor name"
        required: false
        type: string
        default: "vmaas-helm"
      image-overrides:
        description: "JSON object mapping Helm value paths to image refs, e.g. '{\"service.images.service\":\"ghcr.io/osac-project/fulfillment-service:pr-123\"}'"
        required: false
        type: string
        default: "{}"
      component-image:
        description: "Full image:tag for component override (e.g. ghcr.io/osac-project/osac-operator:pr-42)"
        required: false
        type: string
        default: ""
      component-image-name:
        description: "Image name to match and replace in values file (e.g. ghcr.io/osac-project/osac-operator)"
        required: false
        type: string
        default: ""
      aap-git-branch:
        description: "For osac-aap PRs: PR head SHA for projectGitBranch override"
        required: false
        type: string
        default: ""
      aap-git-uri:
        description: "For osac-aap fork PRs: fork repo URL for projectGitUri override"
        required: false
        type: string
        default: ""
      installer-ref:
        description: "osac-installer git ref to clone (branch, tag, or SHA)"
        required: false
        type: string
        default: "main"
      deploy-mode:
        description: "Deployment mode: snapshot (boot + refresh) or full-install (setup.sh)"
        required: false
        type: string
        default: "snapshot"
      values-file:
        description: "Helm values file path relative to osac-installer root"
        required: false
        type: string
        default: "values/vmaas-ci/values.yaml"
      timeout:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 90
    outputs:
      result:
        description: "Test result: PASSED or FAILED"
        value: ${{ jobs.e2e.outputs.result }}

jobs:
  e2e:
    runs-on: osac-ci
    environment: e2e-test
    timeout-minutes: ${{ inputs.timeout || 90 }}
    permissions:
      contents: read
    outputs:
      result: ${{ steps.test.outcome == 'success' && 'PASSED' || 'FAILED' }}

    env:
      FLAVOR_LOCK: "/tmp/cluster-tool-flavor-${{ inputs.flavor-name }}.lock"

    steps:
      - name: Set clone name
        run: |
          # Bridge name = br- + first 8 chars of clone name (cluster-tool).
          # Use 1-char suite prefix + last 7 digits of run ID so bridges
          # are unique across suites (vmaas vs caas in same run) and
          # across runs (same suite in different PRs).
          SUITE="${{ inputs.test-suite || 'e2e' }}"
          RUN_ID="${{ github.run_id }}"
          echo "CLONE_NAME=${SUITE:0:1}${RUN_ID: -7}-${SUITE}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Read AppRole credentials
        id: approle
        run: |
          APPROLE_DIR="${HOME}/.vault-server/.approle"
          echo "role-id=$(cat "${APPROLE_DIR}/role-id")" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(cat "${APPROLE_DIR}/secret-id")"
          echo "secret-id=$(cat "${APPROLE_DIR}/secret-id")" >> "$GITHUB_OUTPUT"

      - name: Retrieve secrets from Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: http://127.0.0.1:8200
          method: approle
          roleId: ${{ steps.approle.outputs.role-id }}
          secretId: ${{ steps.approle.outputs.secret-id }}
          exportEnv: false
          secrets: |
            secret/data/osac/e2e/pull-secret dockerconfigjson | PULL_SECRET ;
            secret/data/osac/e2e/aap-license license | AAP_LICENSE

      - name: Set up registry auth and write secrets
        env:
          PULL_SECRET: ${{ steps.vault.outputs.PULL_SECRET }}
          AAP_LICENSE: ${{ steps.vault.outputs.AAP_LICENSE }}
        run: |
          # Set up podman registry auth for flavor pull and test image pulls
          mkdir -p "${HOME}/.config/containers"
          printf '%s' "${PULL_SECRET}" > "${HOME}/.config/containers/auth.json"
          chmod 600 "${HOME}/.config/containers/auth.json"

          # Write secrets for test container mounts
          printf '%s' "${PULL_SECRET}" > "$RUNNER_TEMP/pull-secret.json"
          chmod 600 "$RUNNER_TEMP/pull-secret.json"

          printf '%s' "${AAP_LICENSE}" | base64 -d > "$RUNNER_TEMP/aap-license.zip"
          chmod 600 "$RUNNER_TEMP/aap-license.zip"

      - name: Prepare cluster environment
        env:
          FLAVOR_IMAGE: ${{ inputs.flavor-image }}
          FLAVOR_NAME: ${{ inputs.flavor-name }}
        run: |
          # --- Ensure cluster-tool is configured ---
          CT_CONFIG="${HOME}/.config/cluster-tool"
          ROOT_CONFIG="/root/.config/cluster-tool"
          if [[ -f "${CT_CONFIG}/servers.json" ]] && [[ -f "${CT_CONFIG}/state.json" ]]; then
            echo "cluster-tool already configured."
          elif [[ -f "${ROOT_CONFIG}/servers.json" ]]; then
            echo "Syncing cluster-tool config from root..."
            mkdir -p "${CT_CONFIG}"
            cp "${ROOT_CONFIG}"/{config,servers.json,state.json,cluster-tool.key,cluster-tool.key.pub} "${CT_CONFIG}/" 2>/dev/null || true
          else
            echo "ERROR: cluster-tool not configured. Run machine-init.sh first." >&2
            exit 1
          fi

          # --- Pull cluster flavor if missing or outdated ---
          # Compare the remote image digest with the locally stored one.
          # Pull (under exclusive lock) only when the flavor is absent or
          # the remote image has been updated since the last pull.
          DIGEST_FILE="/tmp/cluster-tool-flavor-${FLAVOR_NAME}.digest"
          REMOTE_DIGEST=$(skopeo inspect "docker://${FLAVOR_IMAGE}" --format '{{.Digest}}' 2>/dev/null || echo "")
          LOCAL_DIGEST=""
          if [[ -f "${DIGEST_FILE}" ]]; then
            LOCAL_DIGEST=$(cat "${DIGEST_FILE}")
          fi

          if sudo python3 /usr/local/bin/cluster-tool flavors \
               | grep -q "^${FLAVOR_NAME} "; then
            if [[ -n "${REMOTE_DIGEST}" ]] && [[ "${REMOTE_DIGEST}" == "${LOCAL_DIGEST}" ]]; then
              echo "Flavor '${FLAVOR_NAME}' is up to date (digest: ${LOCAL_DIGEST}) — skipping pull."
            elif [[ -n "${REMOTE_DIGEST}" ]]; then
              echo "Flavor '${FLAVOR_NAME}' exists but image changed (local: ${LOCAL_DIGEST:-none}, remote: ${REMOTE_DIGEST}) — pulling..."
              flock --exclusive "${FLAVOR_LOCK}" \
                sudo python3 /usr/local/bin/cluster-tool pull "${FLAVOR_IMAGE}"
              echo "${REMOTE_DIGEST}" > "${DIGEST_FILE}"
            else
              echo "Flavor '${FLAVOR_NAME}' already present, could not check remote digest — skipping pull."
            fi
          else
            echo "Flavor '${FLAVOR_NAME}' not found — pulling..."
            flock --exclusive "${FLAVOR_LOCK}" \
              sudo python3 /usr/local/bin/cluster-tool pull "${FLAVOR_IMAGE}"
            if [[ -n "${REMOTE_DIGEST}" ]]; then
              echo "${REMOTE_DIGEST}" > "${DIGEST_FILE}"
            fi
          fi

          # --- Clean up stale clone resources ---
          # Destroy any leftover clone from a previous run attempt, then
          # remove orphaned Linux bridges that survive virsh net-destroy
          # (e.g. from interrupted teardowns). Only targets bridges matching
          # this clone's truncated name — safe with concurrent jobs.
          sudo python3 /usr/local/bin/cluster-tool destroy "${CLONE_NAME}" 2>/dev/null || true
          BRIDGE_PREFIX="br-${CLONE_NAME:0:8}"
          for br in $(ip -o link show | grep -oP "${BRIDGE_PREFIX}[^ @]*"); do
            echo "Removing stale bridge ${br}..."
            sudo ip link set "${br}" down 2>/dev/null || true
            sudo ip link delete "${br}" 2>/dev/null || true
          done

      - name: Boot cluster clone
        env:
          FLAVOR_NAME: ${{ inputs.flavor-name }}
        run: |
          # Shared lock ensures no boot runs while a flavor pull is in progress.
          # Multiple boots can run in parallel (shared locks are compatible).
          flock --shared "${FLAVOR_LOCK}" \
            sudo python3 /usr/local/bin/cluster-tool boot \
              --flavor "${FLAVOR_NAME}" --name "${CLONE_NAME}"

          echo "Cluster clone '${CLONE_NAME}' booted."

          # cluster-tool boot runs as root (via sudo), so both ~/.kube and
          # the kubeconfig are owned by root. Copy to RUNNER_TEMP so the
          # runner user owns it — podman needs this to relabel for :Z mounts.
          sudo cp "${HOME}/.kube/${CLONE_NAME}.kubeconfig" "$RUNNER_TEMP/kubeconfig"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"

      - name: Build test image
        env:
          E2E_IMAGE: "osac-e2e-tests:${{ github.run_id }}-${{ inputs.test-suite || 'e2e' }}"
        run: podman build -t "${E2E_IMAGE}" -f Containerfile .

      - name: Clone osac-installer
        env:
          INSTALLER_REF: ${{ inputs.installer-ref }}
        run: |
          INSTALLER_DIR="$RUNNER_TEMP/osac-installer"
          CLONE_ARGS=(--recurse-submodules --depth 1)
          if [ "${INSTALLER_REF}" != "main" ]; then
            CLONE_ARGS+=(--branch "${INSTALLER_REF}")
          fi
          git clone "${CLONE_ARGS[@]}" \
            https://github.com/osac-project/osac-installer.git "${INSTALLER_DIR}"

      - name: Place secrets for installer
        env:
          AAP_LICENSE_FILE: ${{ runner.temp }}/aap-license.zip
          VALUES_FILE: ${{ inputs.values-file }}
        run: |
          VALUES_DIR="$(dirname "$RUNNER_TEMP/osac-installer/${VALUES_FILE}")"
          mkdir -p "${VALUES_DIR}"
          cp "${AAP_LICENSE_FILE}" "${VALUES_DIR}/license.zip"
          cp "$RUNNER_TEMP/pull-secret.json" "${VALUES_DIR}/pull-secret.json"

      - name: Override component image in values file
        if: inputs.component-image != '' && inputs.component-image-name != ''
        env:
          COMPONENT_IMAGE: ${{ inputs.component-image }}
          COMPONENT_IMAGE_NAME: ${{ inputs.component-image-name }}
          VALUES_FILE: ${{ inputs.values-file }}
        run: |
          VF="$RUNNER_TEMP/osac-installer/${VALUES_FILE}"
          COMPONENT_TAG="${COMPONENT_IMAGE##*:}"
          COMPONENT_REPO="${COMPONENT_IMAGE%:*}"

          sed -i "s|[a-zA-Z0-9./_-]*${COMPONENT_IMAGE_NAME}:[a-zA-Z0-9._-]*|${COMPONENT_IMAGE}|g" "${VF}"
          sed -i "/${COMPONENT_IMAGE_NAME##*/}/{s|repository: .*|repository: ${COMPONENT_REPO}|;n;s/tag: .*/tag: ${COMPONENT_TAG}/}" "${VF}"

          grep -q "${COMPONENT_TAG}" "${VF}" || {
            echo "ERROR: component image override for ${COMPONENT_IMAGE_NAME} not found in ${VALUES_FILE}"
            cat "${VF}"
            exit 1
          }
          echo "Overrode ${COMPONENT_IMAGE_NAME} -> ${COMPONENT_IMAGE}"

      - name: Override AAP project settings
        if: inputs.aap-git-branch != ''
        env:
          AAP_GIT_BRANCH: ${{ inputs.aap-git-branch }}
          AAP_GIT_URI: ${{ inputs.aap-git-uri }}
          COMPONENT_IMAGE: ${{ inputs.component-image }}
          VALUES_FILE: ${{ inputs.values-file }}
        run: |
          VF="$RUNNER_TEMP/osac-installer/${VALUES_FILE}"

          sed -i "s|projectGitBranch: .*|projectGitBranch: \"${AAP_GIT_BRANCH}\"|" "${VF}"
          grep -q "${AAP_GIT_BRANCH}" "${VF}" || {
            echo "ERROR: projectGitBranch override failed"
            exit 1
          }

          if [ -n "${AAP_GIT_URI}" ]; then
            sed -i "s|projectGitUri: .*|projectGitUri: \"${AAP_GIT_URI}\"|" "${VF}"
          fi

          if [ -n "${COMPONENT_IMAGE}" ]; then
            sed -i "s|eeImage: .*|eeImage: \"${COMPONENT_IMAGE}\"|" "${VF}"
          fi

      - name: Wait for KubeVirt
        if: inputs.deploy-mode != 'full-install'
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          echo "Waiting for KubeVirt to be Available..."
          for attempt in $(seq 1 60); do
              AVAILABLE=$(oc get hyperconverged kubevirt-hyperconverged -n openshift-cnv \
                  -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null || echo "Unknown")
              if [[ "${AVAILABLE}" == "True" ]]; then
                  echo "  KubeVirt Available after $((attempt * 10))s"
                  break
              fi
              if [[ $((attempt % 6)) -eq 0 ]]; then
                  echo "  [${attempt}0s] KubeVirt not Available yet"
              fi
              sleep 10
          done
          if [[ "${AVAILABLE}" != "True" ]]; then
              echo "ERROR: KubeVirt not Available after 600s" >&2
              exit 1
          fi

      - name: Deploy OSAC (snapshot refresh)
        if: inputs.deploy-mode != 'full-install'
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          VALUES_FILE: ${{ inputs.values-file }}
          INSTALLER_NAMESPACE: ${{ inputs.namespace }}
          INSTALLER_VM_TEMPLATE: ${{ inputs.vm-template }}
          INSTALLER_CLUSTER_TEMPLATE: ${{ inputs.cluster-template }}
        run: |
          if ! command -v helm &>/dev/null; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi
          if ! command -v yq &>/dev/null; then
            sudo curl -fsSL -o /usr/local/bin/yq \
              "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
            sudo chmod +x /usr/local/bin/yq
          fi

          cd "$RUNNER_TEMP/osac-installer"
          python3 scripts/refresh-after-snapshot.py

      - name: "Deploy OSAC (full install) [EXPERIMENTAL]"
        if: inputs.deploy-mode == 'full-install'
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          DEPLOY_MODE: helm
          VALUES_FILE: ${{ inputs.values-file }}
          INSTALLER_NAMESPACE: ${{ inputs.namespace }}
          INSTALLER_VM_TEMPLATE: ${{ inputs.vm-template }}
          INSTALLER_CLUSTER_TEMPLATE: ${{ inputs.cluster-template }}
        run: |
          if ! command -v helm &>/dev/null; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi

          cd "$RUNNER_TEMP/osac-installer"
          bash scripts/setup.sh

      - name: Apply image overrides
        if: inputs.image-overrides != '{}' && inputs.image-overrides != ''
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          VALUES_FILE: ${{ inputs.values-file }}
          INSTALLER_NAMESPACE: ${{ inputs.namespace }}
          IMAGE_OVERRIDES: ${{ inputs.image-overrides }}
        run: |
          if ! command -v yq &>/dev/null; then
            sudo curl -fsSL -o /usr/local/bin/yq \
              "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
            sudo chmod +x /usr/local/bin/yq
          fi

          cd "$RUNNER_TEMP/osac-installer"
          echo "Applying image overrides..."
          SET_ARGS=()
          for key in $(echo "${IMAGE_OVERRIDES}" | jq -r 'keys[]'); do
            value=$(echo "${IMAGE_OVERRIDES}" | jq -r --arg k "${key}" '.[$k]')
            SET_ARGS+=("--set" "${key}=${value}")
            echo "  --set ${key}=${value}"
          done

          yq -i '(.dependencies[].version) = "0.0.0"' charts/osac/Chart.yaml
          helm dependency update charts/osac/
          helm upgrade osac charts/osac/ \
            --namespace "${INSTALLER_NAMESPACE}" \
            --values "${VALUES_FILE}" \
            "${SET_ARGS[@]}" \
            --timeout 10m \
            --wait

      - name: Run E2E tests
        id: test
        env:
          TEST_SUITE: ${{ inputs.test-suite }}
          TEST_FILTER: ${{ inputs.test-filter }}
          OSAC_NAMESPACE: ${{ inputs.namespace }}
          OSAC_VM_TEMPLATE: ${{ inputs.vm-template }}
          OSAC_CLUSTER_TEMPLATE: ${{ inputs.cluster-template }}
          E2E_IMAGE: "osac-e2e-tests:${{ github.run_id }}-${{ inputs.test-suite || 'e2e' }}"
        run: |
          KUBECONFIG_PATH="$RUNNER_TEMP/kubeconfig"

          TEST_ARGS="tests/"
          if [ -n "${TEST_SUITE}" ]; then
            TEST_ARGS="tests/${TEST_SUITE}/"
          fi

          FILTER_ARGS=""
          if [ -n "${TEST_FILTER}" ]; then
            FILTER_ARGS="-k ${TEST_FILTER}"
          fi

          podman run --rm --network=host \
            -v "${KUBECONFIG_PATH}":/root/.kube/config:ro,Z \
            -v "${RUNNER_TEMP}/pull-secret.json":/root/pull-secret:ro,Z \
            -v "${RUNNER_TEMP}/aap-license.zip":/root/aap-license.zip:ro,Z \
            -e KUBECONFIG=/root/.kube/config \
            -e OSAC_VM_KUBECONFIG=/root/.kube/config \
            -e OSAC_NAMESPACE="${OSAC_NAMESPACE}" \
            -e OSAC_VM_TEMPLATE="${OSAC_VM_TEMPLATE}" \
            -e OSAC_CLUSTER_TEMPLATE="${OSAC_CLUSTER_TEMPLATE}" \
            -e OSAC_PULL_SECRET_PATH=/root/pull-secret \
            "${E2E_IMAGE}" \
            pytest ${TEST_ARGS} ${FILTER_ARGS} \
              --junitxml=/tmp/junit.xml -v

      - name: Gather artifacts
        if: always()
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          NAMESPACE: ${{ inputs.namespace }}
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts
        run: |
          timeout 1200 bash scripts/gather-artifacts.sh || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osac-logs-${{ inputs.test-suite || 'e2e' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        env:
          E2E_IMAGE: "osac-e2e-tests:${{ github.run_id }}-${{ inputs.test-suite || 'e2e' }}"
        run: |
          # --- Destroy cluster clone ---
          echo "Destroying clone '${CLONE_NAME}'..."
          sudo python3 /usr/local/bin/cluster-tool destroy "${CLONE_NAME}" 2>&1 || true

          # Remove orphaned bridges that survive virsh net-destroy
          BRIDGE_PREFIX="br-${CLONE_NAME:0:8}"
          for br in $(ip -o link show | grep -oP "${BRIDGE_PREFIX}[^ @]*"); do
            echo "Removing orphaned bridge ${br}..."
            sudo ip link set "${br}" down 2>/dev/null || true
            sudo ip link delete "${br}" 2>/dev/null || true
          done

          # --- Clean up temporary files ---
          rm -f "$RUNNER_TEMP/pull-secret.json" "$RUNNER_TEMP/aap-license.zip" "$RUNNER_TEMP/kubeconfig"
          rm -f "${HOME}/.config/containers/auth.json"
          rm -rf "$RUNNER_TEMP/osac-installer"
          podman rmi "${E2E_IMAGE}" 2>/dev/null || true
