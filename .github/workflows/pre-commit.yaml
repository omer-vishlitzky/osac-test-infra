---
name: pre-commit

on:
  pull_request:
    paths-ignore:
      - 'OWNERS'
      - 'LICENSE'
      - '*.md'
      - 'docs/**'
  # No paths-ignore: merge queue requires this job to post a check on the
  # speculative SHA. Workflow-level skip = missing check = 120m timeout.
  merge_group:
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: pre-commit/action@v3.0.1
