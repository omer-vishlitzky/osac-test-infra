---
name: Monitoring unit tests

# Contract changes need the same validation as their producers and consumers.
on:
  pull_request:
    paths:
      - "monitoring/scripts/**"
      - "monitoring/ci_observability/**"
      - "monitoring/tests/**"
      - ".github/workflows/monitoring-unit-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      # The same Python as the workflow-exporter image
      # (monitoring/containers/Containerfile.workflow-exporter).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install --quiet -r monitoring/tests/requirements.txt
      - name: Run unit tests
        working-directory: monitoring/tests
        run: python3 -m pytest
