---
# Remove e2e-ready label on new push (stale after head changes).
# lgtm is handled by Prow; e2e-ready needs explicit cleanup.
name: Remove e2e-ready label on new push
on:
  pull_request_target:
    types: [synchronize]
  workflow_call: {}

jobs:
  remove-label:
    if: contains(github.event.pull_request.labels.*.name, 'e2e-ready')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove stale e2e-ready label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr edit "${PR_NUMBER}" -R "${REPO}" --remove-label "e2e-ready"
          gh pr comment "${PR_NUMBER}" -R "${REPO}" \
            --body "Removed \`e2e-ready\` due to new commits. Re-run \`/e2e-ready\` or get \`lgtm\` / CodeRabbit approval to unlock expensive e2e."
