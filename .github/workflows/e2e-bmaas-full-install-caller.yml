---
name: E2E BMaaS Full Install

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'OWNERS'
      - 'LICENSE'
      - '*.md'
      - 'docs/**'
  merge_group:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      test-suite:
        description: "Suite relative to tests/e2e (bmaas/sanity, bmaas/regression, bmaas/serial, or bmaas for all). Default: bmaas/sanity"
        required: false
        default: "bmaas/sanity"
      test-filter:
        description: "pytest -k filter (GHA always also excludes TestBmaasNetworking)"
        required: false
        default: ""
      test-marker:
        description: "pytest -m marker (optional). Empty uses directory tiers from test-suite."
        required: false
        default: ""
      installer-ref:
        description: "Branch/ref of the OSAC monorepo"
        required: false
        default: "main"
      installer-repo:
        description: "GitHub repo (owner/name) of the OSAC monorepo"
        required: false
        default: "osac-project/osac"
      image-overrides:
        description: "JSON mapping Helm value paths to image refs"
        required: false
        default: "{}"
      osac-cli-version:
        description: "OSAC CLI version (e.g. 0.0.73). Defaults to latest."
        required: false
        default: ""
      runner-label:
        description: "Self-hosted runner label to target (e.g. osac-ci-1 to pin to one machine for verification/debugging). Defaults to the shared fleet-wide label."
        required: false
        default: ""

concurrency:
  group: e2e-bmaas-full-install-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-bmaas-full-install:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      # See e2e-vmaas-full-install-caller.yml's identical grant for why
      # this is needed.
      id-token: write
    uses: ./.github/workflows/e2e-bmaas-full-install.yml
    with:
      # Overlayed osac tests use directory tiers, not pytest markers.
      # PR/merge_group: bmaas/sanity. Schedule: bmaas/serial. Dispatch: honor input.
      test-suite: >-
        ${{
          inputs.test-suite != '' && inputs.test-suite ||
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'bmaas/sanity' ||
          github.event_name == 'schedule' && 'bmaas/serial' ||
          'bmaas/sanity'
        }}
      # Networking is Netris-lab only. Overlay of tests/e2e/bmaas would collect
      # it from regression/; deselect so GHA matches lifecycle+inventory.
      test-filter: ${{ inputs.test-filter && format('({0}) and not TestBmaasNetworking', inputs.test-filter) || 'not TestBmaasNetworking' }}
      test-marker: ${{ inputs.test-marker || '' }}
      installer-ref: ${{ inputs.installer-ref || 'main' }}
      installer-repo: ${{ inputs.installer-repo || 'osac-project/osac' }}
      image-overrides: ${{ inputs.image-overrides || '{}' }}
      osac-cli-version: ${{ inputs.osac-cli-version || '' }}
      runner-label: ${{ inputs.runner-label || 'osac-ci' }}
      fork-pr-author-association: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.author_association || '' }}
      fork-pr-author: ${{ github.event.pull_request.head.repo.fork && github.event.pull_request.user.login || '' }}
      pr-number: ${{ github.event.pull_request.number }}
      notify-on-failure: ${{ github.event_name == 'schedule' }}
      enable-ai-diagnostic: ${{ github.ref == 'refs/heads/main' }}

  e2e-bmaas-gate:
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [e2e-bmaas-full-install]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "e2e-bmaas-full-install: ${{ needs.e2e-bmaas-full-install.result }}"
          exit 1
      - if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "e2e passed"
